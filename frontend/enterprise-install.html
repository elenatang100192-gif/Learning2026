<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>安装 NexusMind Short Video</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        
        .app-icon {
            width: 120px;
            height: 120px;
            border-radius: 20px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }
        
        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .version {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }
        
        .install-button {
            display: inline-block;
            margin-top: 20px;
            padding: 18px 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .install-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
        }
        
        .install-button:active {
            transform: translateY(0);
        }
        
        .instructions {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #eee;
            text-align: left;
        }
        
        .instructions h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
        }
        
        .instructions ol {
            padding-left: 20px;
            color: #666;
            line-height: 1.8;
        }
        
        .instructions li {
            margin-bottom: 10px;
        }
        
        .warning {
            margin-top: 20px;
            padding: 15px;
            background: #fff3cd;
            border-radius: 8px;
            color: #856404;
            font-size: 14px;
            line-height: 1.6;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .app-icon {
                width: 100px;
                height: 100px;
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="app-icon">📱</div>
        <h1>NexusMind Short Video</h1>
        <p class="version">版本 1.0</p>
        
        <a href="itms-services://?action=download-manifest&url=https://your-domain.com/apps/manifest.plist" 
           class="install-button">
            安装应用
        </a>
        
        <div class="instructions">
            <h2>安装说明</h2>
            <ol>
                <li>点击上方"安装应用"按钮</li>
                <li>等待下载完成</li>
                <li>首次安装需要在设置中信任企业开发者：
                    <br>设置 > 通用 > VPN与设备管理 > 信任企业开发者</li>
            </ol>
        </div>
        
        <div class="warning">
            ⚠️ 请确保使用 Safari 浏览器访问此页面，其他浏览器可能无法正常安装。
        </div>
    </div>
    
    <script>
        // 检测是否在 iOS 设备上
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const isSafari = /Safari/.test(navigator.userAgent) && !/Chrome/.test(navigator.userAgent);
        
        if (!isIOS) {
            document.querySelector('.warning').innerHTML = 
                '⚠️ 此应用需要在 iOS 设备上安装。请在 iPhone 或 iPad 的 Safari 浏览器中打开此页面。';
        } else if (!isSafari) {
            document.querySelector('.warning').innerHTML = 
                '⚠️ 请使用 Safari 浏览器打开此页面以确保正常安装。';
        }
    </script>
</body>
</html>
